name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要写权限来创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：通用二进制，一个包同时覆盖 Intel(x86_64) 与 Apple Silicon(arm64)
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows：x64，仅生成面向普通用户的 NSIS 安装程序(.exe)
          - platform: windows-latest
            args: '--bundles nsis'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 与 main 分支的预热任务共用缓存；tag 构建只恢复，避免保存无法跨 tag 复用的缓存。
          shared-key: 'tauri-desktop-release'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      # On a tag push (v1.2.3), stamp 1.2.3 into the three version files so the
      # built artifacts, latest.json and the release tag all match the tag —
      # no manual version bumping, no v__VERSION__/tag mismatch. Runs on both
      # runners (bash is available on the Windows runner too).
      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "Stamping version: $V"
          node -e "const fs=require('fs');for(const f of ['package.json','src-tauri/tauri.conf.json']){const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');}" "$V"
          node -e "const fs=require('fs');const f='src-tauri/Cargo.toml';let s=fs.readFileSync(f,'utf8');s=s.replace(/^version = \".*\"/m,'version = \"'+process.argv[1]+'\"');fs.writeFileSync(f,s);" "$V"
          echo '--- versions now ---'
          grep '"version"' package.json src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      # Tag 推送时 HEAD 就是该 Tag 指向的提交，因此直接把这条 commit message
      # 写进 Release；手动触发时则使用所选分支当前 HEAD 的 commit message。
      - name: Prepare release notes
        id: release_notes
        shell: bash
        run: |
          delimiter="RELEASE_BODY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "body<<$delimiter"
            echo '## 更新内容'
            echo
            git show -s --format='%B' HEAD
            echo
            echo '---'
            echo
            echo '面向用户的安装包：macOS 通用版(.dmg) 与 Windows x64(.exe)。'
            echo '客户端自动更新所需的归档和签名文件会随版本一并生成。'
            echo
            echo '客户端「设置 → 检查更新」可自动更新到本版本。'
            echo
            echo '注意：本版本未做 Apple / Windows 代码签名，首次打开需绕过系统拦截'
            echo '（macOS 右键→打开；Windows 点“更多信息→仍要运行”）。'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新包的 minisign 签名（客户端用内置 pubkey 校验）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ 取自 tauri.conf.json：tag 推送时已被上一步写成 tag 版本，
          # 所以 release 会挂在正确的 vX.Y.Z 上；手动触发时则用文件里的当前版本。
          tagName: v__VERSION__
          releaseName: 'GitKit v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          # 先出草稿 Release，人工确认后再点 Publish；发布后自动更新才会对客户端生效
          releaseDraft: true
          prerelease: false
          # 合并各平台的 latest.json，供 updater 插件消费
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  verify-updater:
    name: Verify updater metadata
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Verify release assets and updater signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT

          repo_api="/repos/${GITHUB_REPOSITORY}"
          release_json="$verify_dir/release.json"
          updater_json="$verify_dir/latest.json"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$repo_api/releases/tags/${GITHUB_REF_NAME}" > "$release_json"

          latest_id="$(jq -er '.assets[] | select(.name == "latest.json") | .id' "$release_json")"
          gh api \
            -H 'Accept: application/octet-stream' \
            "$repo_api/releases/assets/$latest_id" > "$updater_json"

          jq -e --arg version "${GITHUB_REF_NAME#v}" '.version == $version' "$updater_json" > /dev/null
          jq -e 'any(.assets[]; .name | endswith("_universal.dmg"))' "$release_json" > /dev/null
          jq -e 'any(.assets[]; .name | endswith("_x64-setup.exe"))' "$release_json" > /dev/null
          jq -e '[.assets[].name | select(endswith(".msi"))] | length == 0' "$release_json" > /dev/null

          verify_platform() {
            local platform="$1"
            local expected_signature updater_url updater_name updater_id signature_id actual_signature

            expected_signature="$(jq -er --arg platform "$platform" '.platforms[$platform].signature' "$updater_json")"
            updater_url="$(jq -er --arg platform "$platform" '.platforms[$platform].url' "$updater_json")"

            if [[ "$updater_url" == */releases/assets/* ]]; then
              updater_id="${updater_url##*/}"
              updater_name="$(jq -er --argjson id "$updater_id" '.assets[] | select(.id == $id) | .name' "$release_json")"
            else
              updater_name="${updater_url##*/}"
            fi

            signature_id="$(jq -er --arg name "${updater_name}.sig" '.assets[] | select(.name == $name) | .id' "$release_json")"
            gh api \
              -H 'Accept: application/octet-stream' \
              "$repo_api/releases/assets/$signature_id" > "$verify_dir/${platform}.sig"
            actual_signature="$(tr -d '\r\n' < "$verify_dir/${platform}.sig")"

            if [[ "$actual_signature" != "$expected_signature" ]]; then
              echo "::error title=Updater signature mismatch::$platform does not match ${updater_name}.sig"
              exit 1
            fi

            echo "Verified $platform -> $updater_name"
          }

          verify_platform 'darwin-universal'
          verify_platform 'windows-x86_64-nsis'
